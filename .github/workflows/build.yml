name: Build Sapp APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Sapp project files
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          candidates = ["bundle-4-Sapp-fixed.txt", "Sapp-project.txt"]
          bundle = None
          for c in candidates:
              if Path(c).exists():
                  bundle = Path(c)
                  break

          if bundle is None:
              raise SystemExit("Error: Neither bundle-4-Sapp-fixed.txt nor Sapp-project.txt was found in root.")

          text = bundle.read_text(encoding="utf-8")
          parts = re.split(r'^=====(FILE|B64) (.+?)=====\n', text, flags=re.M)

          if len(parts) < 4:
              raise SystemExit(f"Error: Invalid bundle structure in {bundle.name}")

          count = 0
          for i in range(1, len(parts), 3):
              kind = parts[i]
              path = parts[i + 1]
              body = parts[i + 2]

              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)

              if kind == "B64":
                  p.write_bytes(base64.b64decode("".join(body.split())))
              else:
                  p.write_text(body.lstrip("\ufeff\r\n"), encoding="utf-8")

              count += 1
              print(f"Extracted: {path}")

          required = [
              "settings.gradle",
              "build.gradle",
              "app/build.gradle",
              "app/src/main/AndroidManifest.xml",
              "app/src/main/java/com/sapp/planner/MainActivity.java",
              "app/src/main/java/com/sapp/planner/ReminderReceiver.java",
          ]

          for path in required:
              if not Path(path).exists():
                  raise SystemExit(f"Missing required extraction file: {path}")

          print(f"Extraction completed: {count} files ready.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Built APK
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "No output APK was generated."
            exit 1
          fi
          echo "Success! Produced APK: $APK"
          ls -lh "$APK"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sapp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
